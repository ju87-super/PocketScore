name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
      sha: ${{ steps.policy.outputs.sha }}
    steps:
      # Fixed workflow code, never a pull_request artifact or its executable scripts.
      - name: Check successful main CI and explicit Pages enablement
        id: policy
        env:
          ENABLE_PAGES_CD: ${{ vars.ENABLE_PAGES_CD }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const run = event.workflow_run;
          const allowed = process.env.ENABLE_PAGES_CD === 'true'
            && run?.name === 'Validate' && run.event === 'push' && run.conclusion === 'success'
            && run.head_branch === 'main' && run.head_repository?.full_name === process.env.GITHUB_REPOSITORY
            && /^[a-f0-9]{40}$/.test(run.head_sha);
          appendFileSync(process.env.GITHUB_OUTPUT, `allowed=${allowed}\nsha=${allowed ? run.head_sha : ''}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Pages eligibility\n\n${allowed ? 'Eligible validated main commit: ' + run.head_sha : 'NOT DEPLOYED: requires successful main push CI and ENABLE_PAGES_CD=true. Configure Pages and environment permissions before enabling.'}\n`);
          JS
  build:
    needs: eligibility
    if: needs.eligibility.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Reject superseded CI results
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.eligibility.outputs.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
      - uses: actions/configure-pages@v6
        with:
          enablement: false
      - run: npm run build
      - name: Verify production asset/base/SPA manifest
        env:
          EXPECTED_SHA: ${{ needs.eligibility.outputs.sha }}
        run: node tools/ci/pages-build.mjs dist
      - run: npx playwright install --with-deps chromium
      - name: Smoke the exact production artifact before deployment
        env:
          POCKETSCORE_EXPECTED_SHA: ${{ needs.eligibility.outputs.sha }}
        run: npx playwright test --config tests/deployment/local.config.ts
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Upload predeployment reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pages-predeployment-${{ github.run_attempt }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14
  deploy:
    needs: [eligibility, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check main again immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.eligibility.outputs.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
      - uses: actions/deploy-pages@v5
        id: deployment
  smoke:
    needs: [eligibility, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/audio/*.sf3
      - uses: ./.github/actions/setup-node
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed commit, SPA, assets and basic editing
        env:
          POCKETSCORE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          POCKETSCORE_EXPECTED_SHA: ${{ needs.eligibility.outputs.sha }}
        run: npx playwright test --config tests/deployment/playwright.config.ts
      - name: Upload deployed smoke result and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pages-smoke-${{ github.run_attempt }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14

name: Pinned Node and locked dependencies
description: Reproduce the project toolchain and record installation failures
runs:
  using: composite
  steps:
    - name: Trust only the checked-out workspace for Git
      shell: bash
      run: |
        set -euo pipefail
        test -e .git
        git config --global --add safe.directory "$PWD"
        git rev-parse --show-toplevel
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Verify pinned toolchain and install
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p reports/setup
        test "$(node --version)" = "v$(cat .nvmrc)"
        expected_npm="$(node -p 'require("./package.json").packageManager.split("@")[1]')"
        if [ "$(npm --version)" != "$expected_npm" ]; then
          npm install --global "npm@$expected_npm"
        fi
        test "npm@$(npm --version)" = "$(node -p 'require("./package.json").packageManager')"
        npm ci 2>&1 | tee reports/setup/npm-ci.log
    - name: Verify unchanged dependency manifests
      shell: bash
      run: |
        set -euo pipefail
        git rev-parse --verify HEAD > /dev/null
        git diff --exit-code HEAD -- package.json package-lock.json
